    <script>
      // Set the theme before first paint so there is no flash.
      ;(function () {
        var t
        try { t = localStorage.getItem('pf:theme') } catch (e) {}
        if (t) t = JSON.parse(t)
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Offline shell. Skipped in the Android app, which already has the files on device.
      // The Capacitor bridge is injected before page scripts, so window.Capacitor tells us we're in the APK.
      if ('serviceWorker' in navigator && !window.Capacitor) {
        addEventListener('load', () => {
          if (!window.Capacitor) navigator.serviceWorker.register('sw.js').catch(() => {})
        })
      }
    </script>
  </body>
